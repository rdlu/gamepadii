name: Release-plz

# At each push to main, update the release PR (the next version and its
# CHANGELOG section). A merge of the release PR makes the tag and the GitHub
# release. Config: release-plz.toml. Steps: docs/RELEASE.md.
#
# RELEASE_PLZ_TOKEN is a fine-grained PAT for this repo with Contents and
# Pull requests write access. The default GITHUB_TOKEN does not start CI on
# the release PR, and main requires CI.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.repository_owner == 'rdlu'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Release PR
    if: github.repository_owner == 'rdlu'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
