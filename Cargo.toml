[workspace]
resolver = "3"
members = ["crates/gamepadii-core", "crates/gamepadii"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains are stable from 1.88, and ratatui 0.30 and time 0.3.55 need it
# too; CI's msrv job builds with exactly this version.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rdlu/gamepadii"
homepage = "https://gamepadii.dlu.one"
documentation = "https://gamepadii.dlu.one/docs/"
keywords = ["gp2040-ce", "gamepad", "linux", "cli", "tui"]
categories = ["command-line-utilities", "hardware-support"]

# Shared versions, pinned in full. Members opt in with `dep.workspace = true`.
[workspace.dependencies]
gamepadii-core = { path = "crates/gamepadii-core", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
# `unstable-dynamic`: completion of names from the library and the device
# cache. Its API can change in a minor version: check it after an update.
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
# usbfs ioctls for the control channel (Linux only).
libc = "0.2.191"
crossterm = "0.29.0"
# The profile library (KDL 2.0). kdl 6.6 and later need Rust 1.95; 6.5 builds
# on the MSRV.
kdl = "6.5.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: backups and read-modify-writes keep the device's key order.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"

[profile.release]
strip = true
